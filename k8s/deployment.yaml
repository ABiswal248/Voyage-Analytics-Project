apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voyage-api
  template:
    metadata:
      labels:
        app: voyage-api
    spec:
      containers:
        - name: api
          image: host.docker.internal:5002/voyage-analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: voyage-api-service
spec:
  selector:
    app: voyage-api
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP





